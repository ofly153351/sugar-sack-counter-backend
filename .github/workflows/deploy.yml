name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Start Deploy"

            cd /root/sugar-sack/sugar-sack-counter-backend

            # ensure pm2 installed
            if ! command -v pm2 &> /dev/null; then
              echo "Installing PM2..."
              npm install -g pm2
            fi

            git pull

            npm install

            rm -rf dist

            # Prisma Version Check
            PRISMA_VERSION=$(npm list @prisma/client 2>/dev/null | grep @prisma/client | awk -F@ '{print $3}' | cut -d' ' -f1)

            if [[ "$PRISMA_VERSION" != "5.22.0" ]]; then
              echo "📦 Updating Prisma to 5.22.0..."
              npm install @prisma/client@5.22.0 prisma@5.22.0 --legacy-peer-deps
            else
              echo "✅ Prisma already at version 5.22.0"
            fi

            npx prisma generate

            npm run build

            pm2 delete backend || true
            pm2 start dist/main.js --name backend

            # Python AI Service
            cd python-ai-service

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            ./venv/bin/pip install -r requirements.txt

            pm2 delete ai-service || true
            pm2 start main.py --name ai-service --interpreter ./venv/bin/python

            pm2 save
            pm2 status