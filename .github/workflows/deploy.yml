name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Start Deploy"

            cd /root/sugar-sack/sugar-sack-counter-backend

            # ---------- PM2 ----------
            if ! command -v pm2 &> /dev/null; then
              echo "Installing PM2..."
              npm install -g pm2
            fi

            # ---------- Git ----------
            git fetch origin main
            git reset --hard origin/main

            # ---------- Node Backend ----------
            npm install
            rm -rf dist

            PRISMA_VERSION=$(npm list @prisma/client 2>/dev/null | grep @prisma/client | awk -F@ '{print $3}' | cut -d' ' -f1)

            if [[ "$PRISMA_VERSION" != "5.22.0" ]]; then
              echo "📦 Updating Prisma to 5.22.0..."
              npm install @prisma/client@5.22.0 prisma@5.22.0 --legacy-peer-deps
            else
              echo "✅ Prisma already at version 5.22.0"
            fi

            npx prisma generate

            # ---------- Prisma Migrate ----------
            SHOULD_MIGRATE=false
            if git rev-parse -q --verify HEAD~1 >/dev/null; then
              if git diff --name-only HEAD~1 HEAD | grep -E "prisma/schema.prisma|prisma/migrations/" >/dev/null; then
                SHOULD_MIGRATE=true
              fi
            else
              SHOULD_MIGRATE=true
            fi

            if [ "$SHOULD_MIGRATE" = true ]; then
              echo "🗄️ Running prisma migrate deploy..."
              npx prisma migrate deploy
            else
              echo "✅ No Prisma schema changes detected"
            fi
            npm run build

            pm2 delete backend || true
            pm2 start dist/main.js --name backend

            # ---------- Python AI ----------
            cd python-ai-service

            echo "🐍 Detect Python"
            if ! command -v python3.10 &> /dev/null; then
              echo "Python 3.10 not found. Installing..."
              apt-get update
              apt-get install -y python3.10 python3.10-venv python3.10-distutils
            fi
            PYTHON_BIN=python3.10

            echo "Using Python: $PYTHON_BIN"

            # ---------- Check if need rebuild ----------
            NEED_REBUILD=false

            if [ ! -d "venv" ]; then
              NEED_REBUILD=true
            fi

            if [ -d "venv" ]; then
              if ! ./venv/bin/python -c "import torch, ultralytics; ok=(torch.__version__=='2.5.1+cpu' and ultralytics.__version__=='8.4.8'); raise SystemExit(0 if ok else 1)" >/dev/null 2>&1; then
                NEED_REBUILD=true
              fi
            fi

            # ---------- Rebuild if needed ----------
            if [ "$NEED_REBUILD" = true ]; then
              echo "📦 Rebuilding VENV"

              rm -rf venv
              $PYTHON_BIN -m venv venv

              ./venv/bin/pip install -U pip setuptools wheel

              echo "📦 Install Torch (CPU)"
              ./venv/bin/pip install torch==2.5.1+cpu torchvision==0.20.1+cpu torchaudio==2.5.1+cpu \
                --index-url https://download.pytorch.org/whl/cpu

              echo "📦 Install requirements"
              ./venv/bin/pip install -r requirement-prod.txt --upgrade --no-cache-dir

            else
              echo "✅ Using existing VENV"
            fi

            # ---------- PM2 ----------
            pm2 delete ai-service || true

            pm2 start main.py \
              --name ai-service \
              --interpreter ./venv/bin/python \
              --time

            pm2 save
