version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sugar_sack_counter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sugar_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # NestJS Backend - Using Bun for faster installation
  backend:
    image: oven/bun:1-alpine
    working_dir: /app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-sugar_password}@postgres:5432/sugar_sack_counter?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: sugar-sacks
      PORT: 3000
      CORS_ORIGIN: "*"
      BUN_JSC_useJIT: "1"
      BUN_JSC_useDFGJIT: "1"
    ports:
      - "3000:3000"
    volumes:
      - ../:/app
      - backend_bun_cache:/root/.bun/install/cache
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      sh -c "
      # Clean up old files
      echo 'Cleaning up old files...' &&
      rm -rf node_modules bun.lockb 2>/dev/null || true &&

      # Install dependencies with Bun (much faster and uses less memory)
      echo 'Installing dependencies with Bun...' &&
      bun install --production --frozen-lockfile --no-progress &&

      # Generate Prisma client (Bun can run npx commands)
      echo 'Generating Prisma client...' &&
      bunx prisma generate --schema=./prisma/schema.prisma &&

      # Build application with Bun
      echo 'Building application...' &&
      bun run build 2>&1 | tail -20 &&

      # Start application
      echo 'Starting application...' &&
      bun run dist/main.js
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  backend_bun_cache:

networks:
  default:
    name: sugar-sack-network
