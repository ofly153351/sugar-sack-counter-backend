name: Deploy Backend to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            echo "=== Starting Deployment ==="

            cd /opt/sugar-sack-counter/sugar-sack-counter-backend

            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            echo "📦 Installing dependencies with legacy-peer-deps..."
            npm ci --legacy-peer-deps --only=production

            echo "🔨 Building project..."
            npm run build

            echo "🗄️ Running Prisma migrations (if any)..."
            npx prisma db push 2>/dev/null || echo "No Prisma setup found"

            echo "🔄 Restarting PM2 process..."
            pm2 restart sugar-sack-backend --update-env

            echo "⏳ Waiting for app to start..."
            sleep 10

            echo "🏥 Checking application health..."

            # Health check with retries
            MAX_RETRIES=15
            COUNT=0
            while [ $COUNT -lt $MAX_RETRIES ]; do
              if curl -s -f http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                echo "=== Deployment Successful ==="
                exit 0
              fi

              COUNT=$((COUNT+1))
              echo "⏳ Attempt $COUNT/$MAX_RETRIES - Waiting for app to start..."

              # Check PM2 logs
              pm2 logs sugar-sack-backend --lines 3 --nostream 2>/dev/null || true

              sleep 5
            done

            echo "❌ Health check failed after $MAX_RETRIES attempts"
            echo "📋 Checking application status..."

            # Debug information
            echo "=== DEBUG INFO ==="
            pm2 status
            pm2 logs sugar-sack-backend --lines 20 --nostream 2>/dev/null || true
            netstat -tlnp | grep :3001 || echo "Port 3001 not listening"
            ps aux | grep node | grep -v grep || echo "No node process found"

            exit 1
