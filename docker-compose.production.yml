services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sugar_sack_counter}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sugar_sack_counter}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: myminio:minio
    build:
      context: ./minio
      dockerfile: Dockerfile
      args:
        MINIO_REF: ${MINIO_REF:-master}
        MC_REF: ${MC_REF:-master}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-client:
    image: myminio:minio
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-sugar-sacks} --ignore-existing &&
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-sugar-sacks};
      exit 0"

  ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8082
      MODEL_PATH: /app/${AI_MODEL_FILE:-bestStudent.pt}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.45}
      BOX_CONFIDENCE_THRESHOLD: ${BOX_CONFIDENCE_THRESHOLD:-0.2}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sugar-sacks}
    ports:
      - "${AI_HOST_PORT:-8082}:8082"
    volumes:
      - ./python-ai-service:/app
      - ai_python_cache:/root/.cache
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend-mounted
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-sugar_sack_counter}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-production-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sugar-sacks}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8082}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-client:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  minio_data:
  backend_node_modules:
  ai_python_cache:
