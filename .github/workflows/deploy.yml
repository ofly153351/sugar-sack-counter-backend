name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/sugar-sack-counter/sugar-sack-counter-backend

            pm2 delete sugar-sack-backend || true
            git pull

            # ❌ ไม่ต้องลบ node_modules ทุกครั้ง (ลดจาก 3+ นาที เหลือ 30 วินาที)
            # rm -rf dist node_modules package-lock.json

            # ✅ ลบแค่ dist (ใช้เวลาไม่กี่วินาที)
            rm -rf dist

            # ✅ ตรวจสอบ Prisma version ปัจจุบันก่อน
            PRISMA_VERSION=$(npm list @prisma/client 2>/dev/null | grep @prisma/client | awk -F@ '{print $3}' | cut -d' ' -f1)

            # ✅ ติดตั้ง Prisma 5 เฉพาะตอนจำเป็น
            if [[ "$PRISMA_VERSION" != "5.22.0" ]]; then
              echo "📦 Updating Prisma to 5.22.0..."
              npm install @prisma/client@5.22.0 prisma@5.22.0 --legacy-peer-deps
            else
              echo "✅ Prisma already at version 5.22.0"
            fi

            # ✅ Generate Prisma client (สำคัญ)
            npx prisma generate

            # ✅ Build
            npm run build

            pm2 start dist/main.js --name backend

            # --- Python AI Service ---
            pm2 delete backend || true
            cd /root/sugar-sack/sugar-sack-counter-backend/python-ai-service

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            ./venv/bin/pip install -r requirements.txt
            pm2 start ./main.py --name sugar-sack-ai --interpreter ./venv/bin/python
            pm2 status
