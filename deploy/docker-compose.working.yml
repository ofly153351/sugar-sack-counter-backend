version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sugar_sack_counter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sugar_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # NestJS Backend - Simple and reliable
  backend:
    image: node:18-alpine
    working_dir: /app
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-sugar_password}@postgres:5432/sugar_sack_counter?schema=public"
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: sugar-sacks
      PORT: 3000
      CORS_ORIGIN: "*"
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
      echo 'Installing dependencies...' &&
      npm install --no-audit --prefer-offline --progress=false &&
      echo 'Generating Prisma client...' &&
      npx prisma generate &&
      echo 'Building application...' &&
      npm run build &&
      echo 'Starting application...' &&
      node dist/main.js
      "
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    driver: bridge
