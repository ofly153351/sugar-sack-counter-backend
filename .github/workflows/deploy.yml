name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Start Deploy"

            cd /root/sugar-sack/sugar-sack-counter-backend

            # ---------- PM2 ----------
            if ! command -v pm2 &> /dev/null; then
              echo "Installing PM2..."
              npm install -g pm2
            fi

            # ---------- Git ----------
            git fetch origin main
            git reset --hard origin/main

            # ---------- Node Backend ----------
            npm install
            rm -rf dist

            PRISMA_VERSION=$(npm list @prisma/client 2>/dev/null | grep @prisma/client | awk -F@ '{print $3}' | cut -d' ' -f1)

            if [[ "$PRISMA_VERSION" != "5.22.0" ]]; then
              echo "📦 Updating Prisma to 5.22.0..."
              npm install @prisma/client@5.22.0 prisma@5.22.0 --legacy-peer-deps
            else
              echo "✅ Prisma already at version 5.22.0"
            fi

            npx prisma generate
            npm run build

            pm2 delete backend || true
            pm2 start dist/main.js --name backend

            # ---------- Python AI ----------
            cd python-ai-service

            echo "🐍 Checking Python Version"
            if command -v python3.9 &> /dev/null; then
              PYTHON_BIN=python3.9
            elif command -v python3.10 &> /dev/null; then
              PYTHON_BIN=python3.10
            else
              PYTHON_BIN=python3
            fi

            echo "Using Python: $PYTHON_BIN"

            REQUIREMENTS_CHANGED=false
            if git diff HEAD~1 HEAD -- requirement-prod.txt | grep .; then
              REQUIREMENTS_CHANGED=true
            fi

            NEED_REBUILD=false
            if [ ! -d "venv" ] || [ "$REQUIREMENTS_CHANGED" = true ]; then
              NEED_REBUILD=true
            fi
            if [ -d "venv" ] && ! ./venv/bin/python -c "import cv2, fastapi, ultralytics" >/dev/null 2>&1; then
              NEED_REBUILD=true
            fi

            if [ "$NEED_REBUILD" = true ]; then
              echo "📦 Rebuilding Python VENV..."

              rm -rf venv
              $PYTHON_BIN -m venv venv

              ./venv/bin/pip install -U pip setuptools wheel

              echo "📦 Installing Torch CPU"
              ./venv/bin/pip install torch==2.0.1+cpu torchvision==0.15.2+cpu \
              --index-url https://download.pytorch.org/whl/cpu

              echo "📦 Installing Requirements"
              ./venv/bin/pip install -r requirement-prod.txt
            else
              echo "✅ requirement-prod.txt not changed → skip pip install"
            fi

            # Ensure pkg_resources is available at runtime
            ./venv/bin/pip install -U setuptools

            pm2 delete ai-service || true
            pm2 start main.py --name ai-service --interpreter ./venv/bin/python

            pm2 save
            pm2 status
