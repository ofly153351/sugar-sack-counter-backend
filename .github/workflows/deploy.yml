name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/sugar-sack-counter/sugar-sack-counter-backend

            pm2 delete sugar-sack-backend || true
            git pull

            # ติดตั้ง Prisma 4 โดยเฉพาะ
            echo "Installing Prisma 4..."
            npm install @prisma/client@4.16.2 prisma@4.16.2 --legacy-peer-deps

            # ติดตั้ง dependencies อื่นๆ
            npm ci --legacy-peer-deps

            # Generate Prisma client
            npx prisma generate

            # Build
            npm run build

            pm2 start dist/main.js --name sugar-sack-backend
            pm2 status
