name: Deploy to DigitalOcean

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          script: |
            echo "==> Switching to project directory"
            cd /opt/sugar-sack-counter

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Writing environment variables..."
            cat > .env << EOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
            DATABASE_URL=postgresql://postgres:${{ secrets.DB_PASSWORD }}@postgres:5432/sugar_sack_counter?schema=public
            NODE_ENV=production
            PORT=3000
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            AI_SERVICE_URL=http://ai-service:8000
            EOF

            echo "==> Deploying Docker services..."
            docker-compose -f deploy/docker-compose.working.yml pull
            docker-compose -f deploy/docker-compose.working.yml down
            docker-compose -f deploy/docker-compose.working.yml up -d

            echo "==> Running Prisma db push..."
            docker-compose -f deploy/docker-compose.working.yml exec backend npx prisma db push

            echo "==> Cleaning up unused images..."
            docker image prune -f

            echo "==> Waiting for server..."
            sleep 10

            echo "==> Checking health..."
            curl -f http://localhost:3000/api/health || exit 1

            echo "Deployment completed successfully!"

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Slack Success Notification
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: deployments
          SLACK_TITLE: "✅ Deployment Successful"
          SLACK_MESSAGE: "Backend deployed successfully to DigitalOcean"
          SLACK_COLOR: good

      - name: Slack Failure Notification
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: deployments
          SLACK_TITLE: "❌ Deployment Failed"
          SLACK_MESSAGE: "Backend deployment failed!"
          SLACK_COLOR: danger
