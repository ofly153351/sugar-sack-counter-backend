name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/sugar-sack-counter/sugar-sack-counter-backend

            # 1. Stop current PM2
            echo "🛑 Stopping PM2..."
            pm2 stop sugar-sack-backend 2>/dev/null || true
            pm2 delete sugar-sack-backend 2>/dev/null || true

            # 2. Pull latest code
            echo "📥 Pulling code..."
            git pull origin main

            # 3. Clean and fix Prisma issues
            echo "🔧 Fixing Prisma configuration..."

            # ลบไฟล์ prisma config ที่มีปัญหา (ถ้ามี)
            if [ -f "prisma/prisma.config.ts" ]; then
              echo "   Removing problematic prisma.config.ts..."
              mv prisma/prisma.config.ts prisma/prisma.config.ts.backup
            fi

            # อัปเดต Prisma เป็น version 4
            echo "   Updating Prisma dependencies..."
            npm uninstall @prisma/adapter-utils @prisma/adapter-pg 2>/dev/null || true
            npm install @prisma/client@^4.0.0 prisma@^4.0.0 --legacy-peer-deps

            # 4. Install ALL dependencies (include dev)
            echo "📦 Installing dependencies..."
            npm ci --legacy-peer-deps  # ไม่ใช้ --only=production

            # 5. Generate Prisma client
            echo "⚙️ Generating Prisma client..."
            npx prisma generate 2>/dev/null || echo "Prisma generate skipped"

            # 6. Build
            echo "🔨 Building..."

            # ลอง build ด้วยหลายวิธี
            npm run build || npx nest build || npx tsc

            # ถ้า build ไม่ผ่าน ให้ลอง skipLibCheck
            if [ ! -f "dist/main.js" ]; then
              echo "⚠️ Standard build failed, trying with skipLibCheck..."
              npx tsc --skipLibCheck --outDir dist
            fi

            # 7. Check if build successful
            if [ ! -f "dist/main.js" ]; then
              echo "❌ Build failed: dist/main.js not found"
              echo "Debug info:"
              ls -la dist/ 2>/dev/null || echo "dist directory not found"
              exit 1
            fi

            echo "✅ Build successful: $(wc -c < dist/main.js) bytes"

            # 8. Run database migrations
            echo "🗄️ Running database migrations..."
            npx prisma db push 2>/dev/null || echo "Database migration skipped"

            # 9. Start with PM2
            echo "🚀 Starting PM2..."
            pm2 start dist/main.js --name sugar-sack-backend

            # 10. Check status
            echo "✅ Checking..."
            sleep 5
            pm2 status

            # 11. Health check
            echo "🏥 Health check..."
            if curl -s -f http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Application is healthy"
            else
              echo "⚠️ Application may not be responding"
            fi
