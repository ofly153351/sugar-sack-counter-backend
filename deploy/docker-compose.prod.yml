version: "3.8"

services:
  # PostgreSQL Database (Internal)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=sugar_sack_counter
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-sugar_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - sugar-sack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=1GB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - sugar-sack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # MinIO Client (for bucket initialization)
  minio-client:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/sugar-sacks --ignore-existing;
      /usr/bin/mc anonymous set download myminio/sugar-sacks;
      echo 'MinIO bucket initialized successfully';
      tail -f /dev/null
      "
    networks:
      - sugar-sack-network
    restart: on-failure

  # NestJS Backend Application
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-sugar_password}@postgres:5432/sugar_sack_counter?schema=public
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=sugar-sacks
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000}
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - sugar-sack-network
    volumes:
      - uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Python AI Service (optional)
  ai-service:
    build:
      context: ../python-ai-service
      dockerfile: Dockerfile
    environment:
      - MODEL_PATH=/app/models/yolov8n.pt
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ai_models:/app/models
    networks:
      - sugar-sack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Uncomment if you want to use AI service
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - sugar-sack-network
    restart: unless-stopped

  # Database Backup Service (optional)
  db-backup:
    image: postgres:15-alpine
    depends_on:
      - postgres
    volumes:
      - db_backups:/backups
      - ./scripts/backup.sh:/backup.sh
    networks:
      - sugar-sack-network
    command: >
      /bin/sh -c "
      echo 'Database backup service started';
      while true; do
        sleep 86400;
        PGPASSWORD=${DB_PASSWORD:-sugar_password} pg_dump -h postgres -U postgres sugar_sack_counter > /backups/backup_$(date +%Y%m%d_%H%M%S).sql;
        echo 'Backup created at $(date)';
        find /backups -name 'backup_*.sql' -mtime +7 -delete;
      done
      "
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  ai_models:
  uploads:
  logs:
  db_backups:

networks:
  sugar-sack-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
