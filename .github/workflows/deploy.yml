name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/sugar-sack-counter/sugar-sack-counter-backend

            # 1. Stop current PM2
            echo "Stopping PM2..."
            pm2 stop sugar-sack-backend 2>/dev/null || true
            pm2 delete sugar-sack-backend 2>/dev/null || true

            # 2. Pull latest code
            echo "Pulling code..."
            git pull origin main

            # 3. Install with legacy-peer-deps
            echo "Installing dependencies..."
            npm ci --legacy-peer-deps --only=production

            # 4. Build
            echo "Building..."
            npm run build

            # 5. Start with PM2
            echo "Starting PM2..."
            pm2 start dist/main.js --name sugar-sack-backend

            # 6. Check status
            echo "Checking..."
            sleep 3
            pm2 status
