name: Deploy to DigitalOcean

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sugar_sack_counter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm test
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/sugar_sack_counter
        JWT_SECRET: test-jwt-secret

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to DigitalOcean
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USERNAME }}
        key: ${{ secrets.DO_SSH_KEY }}
        port: ${{ secrets.DO_PORT }}
        script: |
          # Navigate to application directory
          cd /opt/sugar-sack-counter

          # Pull latest changes
          git pull origin main

          # Copy environment file if it doesn't exist
          if [ ! -f .env ]; then
            cp deploy/.env.production .env
            echo "Created .env file from template"
          fi

          # Update environment variables from GitHub Secrets
          echo "Updating environment variables..."
          cat > .env << EOF
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          DATABASE_URL=postgresql://postgres:${{ secrets.DB_PASSWORD }}@postgres:5432/sugar_sack_counter?schema=public
          NODE_ENV=production
          PORT=3000
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          AI_SERVICE_URL=http://ai-service:8000
          EOF

          # Pull latest Docker images
          echo "Pulling latest Docker images..."
          docker-compose -f deploy/docker-compose.prod.yml pull

          # Stop and remove old containers
          echo "Stopping old containers..."
          docker-compose -f deploy/docker-compose.prod.yml down

          # Start new containers
          echo "Starting new containers..."
          docker-compose -f deploy/docker-compose.prod.yml up -d

          # Run database migrations
          echo "Running database migrations..."
          docker-compose -f deploy/docker-compose.prod.yml exec backend npx prisma db push

          # Clean up old Docker images
          echo "Cleaning up old Docker images..."
          docker image prune -f

          # Check application health
          echo "Checking application health..."
          sleep 10
          curl -f http://localhost:3000/api/health || exit 1

          echo "Deployment completed successfully!"

    - name: Verify deployment
      run: |
        sleep 30
        curl -f ${{ secrets.DEPLOYMENT_URL }}/api/health || exit 1
        echo "Deployment verified successfully!"

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Send Slack notification on success
      if: success()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: deployments
        SLACK_TITLE: "✅ Deployment Successful"
        SLACK_MESSAGE: "Sugar Sack Counter Backend deployed successfully to DigitalOcean"
        SLACK_COLOR: good

    - name: Send Slack notification on failure
      if: failure()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: deployments
        SLACK_TITLE: "❌ Deployment Failed"
        SLACK_MESSAGE: "Sugar Sack Counter Backend deployment failed. Check GitHub Actions logs."
        SLACK_COLOR: danger
